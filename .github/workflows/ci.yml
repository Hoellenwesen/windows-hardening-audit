name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build WinHardeningAudit.slnx -c Release --nologo
      - name: Test
        run: dotnet test WinHardeningAudit.slnx -c Release --no-build --nologo

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable package
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if ([string]::IsNullOrWhiteSpace($Version)) { throw 'No version in tag ref' }
          powershell -ExecutionPolicy Bypass -File dist\Build-Package.ps1 -Version $Version
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $Zip = "dist\out\WinHardeningAudit-$Version-win-x64.zip"
          $Info = "dist\out\WinHardeningAudit-$Version-win-x64\Version.txt"
          if (-not (Test-Path -LiteralPath $Zip)) { throw "Package not found: $Zip" }
          gh release create "v$Version" --title "v$Version" --generate-notes $Zip $Info
